name: Laravel CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ==========================================
  # 1. TEST / CI
  # ==========================================
  test:

    runs-on: ubuntu-latest

    services:

      mysql:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laravel_test
          MYSQL_USER: laravel
          MYSQL_PASSWORD: password

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5


    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo_mysql
          coverage: none


      # 3. Install Composer dependencies
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader


      # 4. Prepare Laravel environment
      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate


      # 5. Configure database
      - name: Configure database
        run: |
          cat >> .env <<'EOF'

          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=laravel_test
          DB_USERNAME=laravel
          DB_PASSWORD=password
          DB_URL=
          EOF

          php artisan config:clear


      # 6. Run migrations
      - name: Run migrations
        run: php artisan migrate --force


      # 7. Run tests
      - name: Run tests
        run: php artisan test


      # 8. Run Laravel Pint
      - name: Run Laravel Pint
        run: ./vendor/bin/pint --test


      # 9. Build application
      - name: Build application
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache


  # ==========================================
  # 2. DEPLOY / CD
  # ==========================================
  deploy:

    # لا يبدأ Deploy إلا إذا نجح test
    needs: test

    # Deploy فقط عند Push مباشر إلى main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      # 1. Setup SSH
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key


      # 2. Add server to known_hosts
      - name: Add server to known_hosts
        run: |
          ssh-keyscan -p ${{ vars.SERVER_PORT }} \
            ${{ vars.SERVER_HOST }} >> ~/.ssh/known_hosts


      # 3. Deploy application
      - name: Deploy
        run: |
          ssh \
            -p ${{ vars.SERVER_PORT }} \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            deploy@${{ vars.SERVER_HOST }} \
            "/var/www/myapp/deploy.sh ${{ github.sha }}"
